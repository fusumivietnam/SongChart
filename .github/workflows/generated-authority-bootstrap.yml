name: generated-authority-bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: generated-authority-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, intl, mbstring, pcntl, pdo_pgsql, redis, xml, zip
          coverage: none

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate authority from exact source tree
        run: |
          php scripts/project-context.php --write-source
          php scripts/compile-repository-contracts.php --refresh-check
          git diff --check

      - name: Reject mutations outside generated authority
        run: |
          unexpected="$(git status --porcelain --untracked-files=all | grep -vE '^.. docs/project/generated(/|$)' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' 'Unexpected generated-authority mutation:' "$unexpected" >&2
            exit 1
          fi

      - name: Capture generated authority artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-authority-${{ github.event.pull_request.head.sha }}
          path: docs/project/generated/
          if-no-files-found: error
          retention-days: 3

      - name: Report generated diff
        run: |
          {
            echo '## Generated authority bootstrap'
            echo
            echo "Exact source SHA: ${{ github.event.pull_request.head.sha }}"
            echo
            echo 'This workflow does not commit or push. The artifact is diagnostic/generated output only.'
            echo
            echo '```text'
            git status --short -- docs/project/generated
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
