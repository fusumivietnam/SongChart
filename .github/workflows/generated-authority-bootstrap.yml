name: generated-authority-bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: generated-authority-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'stage-19.0-delivery-kernel-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, intl, mbstring, pcntl, pdo_pgsql, redis, xml, zip
          coverage: none

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate authority from exact source tree
        run: |
          php scripts/project-context.php --write-source
          php scripts/compile-repository-contracts.php --refresh-check
          git diff --check

      - name: Reject mutations outside generated authority
        run: |
          unexpected="$(git status --porcelain --untracked-files=all | grep -vE '^.. docs/project/generated(/|$)' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' 'Unexpected generated-authority mutation:' "$unexpected" >&2
            exit 1
          fi

      - name: Capture generated authority artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-authority-${{ github.event.pull_request.head.sha }}
          path: docs/project/generated/
          if-no-files-found: error
          retention-days: 3

      - name: Apply generated-only bootstrap refresh
        run: |
          if [ -z "$(git status --porcelain -- docs/project/generated)" ]; then
            echo 'Generated authority already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/project/generated
          unexpected="$(git diff --cached --name-only | grep -vE '^docs/project/generated/' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' 'Refusing generated commit outside owned path:' "$unexpected" >&2
            exit 1
          fi
          git commit -m 'chore: refresh generated repository authority'
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Report generated diff
        if: always()
        run: |
          {
            echo '## Generated authority bootstrap'
            echo
            echo "Source SHA: ${{ github.event.pull_request.head.sha }}"
            echo
            echo 'Bootstrap is branch-locked and may commit only docs/project/generated output produced by canonical generators.'
          } >> "$GITHUB_STEP_SUMMARY"
