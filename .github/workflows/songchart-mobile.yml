name: SongChart Mobile

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose the governed verification action'
        required: true
        default: check
        type: choice
        options:
          - check
          - close

permissions:
  contents: read

env:
  SONGCHART_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: songchart-mobile-${{ github.event.pull_request.number || github.ref }}-${{ inputs.action || 'bootstrap-close' }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'stage-19.0-delivery-kernel-hardening')
    name: ${{ github.event_name == 'pull_request' && 'BOOTSTRAP CLOSE — canonical exact SHA' || (inputs.action == 'close' && 'CLOSE — canonical exact SHA' || 'CHECK — focused verification') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected exact SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SONGCHART_TARGET_SHA }}
          fetch-depth: 0

      - name: Prepare Docker development configuration
        run: cp .env.docker.example .env.docker

      - name: Record exact SHA
        run: |
          test "$(git rev-parse HEAD)" = "$SONGCHART_TARGET_SHA"
          printf 'SONGCHART_MOBILE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'Selected exact SHA: %s\n' "$(git rev-parse HEAD)"

      - name: CHECK — governed focused verification
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'check'
        run: ./mobile check --verbose

      - name: CLOSE — governed canonical verification
        if: (github.event_name == 'pull_request' && github.head_ref == 'stage-19.0-delivery-kernel-hardening') || inputs.action == 'close'
        run: ./songchart verify

      - name: Prove verification did not mutate tracked source
        run: |
          test "$(git rev-parse HEAD)" = "$SONGCHART_MOBILE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'Exact SHA preserved: %s\n' "$SONGCHART_MOBILE_SHA"

      - name: Summary
        if: always()
        run: |
          action='${{ inputs.action }}'
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            action='bootstrap-close'
          fi
          {
            echo '## SongChart Mobile'
            echo
            echo "- Action: $action"
            echo "- SHA: $SONGCHART_MOBILE_SHA"
            echo "- Branch/ref: ${{ github.head_ref || github.ref_name }}"
            echo '- CLOSE is read-only canonical verification; it never prepares or commits generated authority.'
          } >> "$GITHUB_STEP_SUMMARY"
