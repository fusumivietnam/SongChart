name: SongChart Auto Closure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: songchart-auto-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    outputs:
      effective_sha: ${{ steps.result.outputs.effective_sha }}
    steps:
      - name: Checkout exact PR head without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 / 2.37.2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, intl, mbstring, pcntl, pdo_pgsql, redis, xml, zip
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PREPARE — generate deterministic authority
        run: |
          php scripts/project-context.php --write-source
          php scripts/project-state.php --write-source
          php scripts/compile-repository-contracts.php --refresh-check
          git diff --check

      - name: Reject PREPARE mutations outside generated authority
        run: |
          unexpected="$(git status --porcelain --untracked-files=all | grep -vE '^.. docs/project/generated(/|$)' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' 'Unexpected PREPARE mutation:' "$unexpected" >&2
            exit 1
          fi

      - name: Commit generated authority when required
        id: generated_commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- docs/project/generated)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project/generated
          git commit -m 'chore: refresh generated repository authority'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push https://github.com/${{ github.repository }}.git "HEAD:${HEAD_BRANCH}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Publish effective exact SHA
        id: result
        run: |
          effective_sha="$(git rev-parse HEAD)"
          printf 'effective_sha=%s\n' "$effective_sha" >> "$GITHUB_OUTPUT"
          printf 'Effective exact SHA: %s\n' "$effective_sha"

  verify:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      target_sha: ${{ needs.prepare.outputs.effective_sha }}

  close:
    needs:
      - prepare
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      SONGCHART_CLOSE_SHA: ${{ needs.prepare.outputs.effective_sha }}
    steps:
      - name: Checkout verified exact SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SONGCHART_CLOSE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Docker development configuration
        run: cp .env.docker.example .env.docker

      - name: Prove PR head still matches verified SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_head="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .head.sha)"
          test "$current_head" = "$SONGCHART_CLOSE_SHA"
          test "$(git rev-parse HEAD)" = "$SONGCHART_CLOSE_SHA"

      - name: CLOSE — governed canonical verification
        run: ./songchart verify

      - name: Prove canonical verification preserved exact tree
        run: |
          test "$(git rev-parse HEAD)" = "$SONGCHART_CLOSE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

  ready-to-promote:
    needs:
      - prepare
      - verify
      - close
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      SONGCHART_PROMOTION_SHA: ${{ needs.prepare.outputs.effective_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Revalidate exact PR head
        run: |
          current_head="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .head.sha)"
          test "$current_head" = "$SONGCHART_PROMOTION_SHA"

      - name: Capture PR promotion state
        id: promotion
        run: |
          is_draft="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .draft)"
          printf 'is_draft=%s\n' "$is_draft" >> "$GITHUB_OUTPUT"

      - name: Promotion summary
        env:
          SONGCHART_PR_DRAFT: ${{ steps.promotion.outputs.is_draft }}
        run: |
          {
            echo '## Ready to promote'
            echo
            echo "- Exact SHA: $SONGCHART_PROMOTION_SHA"
            echo '- PREPARE: generated project context + derived development state reconciled'
            echo '- CHECK: Quality + PostgreSQL + browser + frontend passed'
            echo '- CLOSE: canonical verification passed without tracked-tree mutation'
            if [ "$SONGCHART_PR_DRAFT" = 'true' ]; then
              echo '- PR state: draft; promote via GitHub UI or an authorized connector'
            else
              echo '- PR state: already ready for review'
            fi
            echo '- Human gate: merge this exact PR head in GitHub'
            echo '- Any new commit invalidates this evidence and restarts auto closure'
          } >> "$GITHUB_STEP_SUMMARY"
