name: tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      target_sha:
        description: 'Exact repository SHA to verify'
        required: false
        type: string

permissions:
  contents: read

env:
  SONGCHART_CI_SHA: ${{ inputs.target_sha || github.sha }}

concurrency:
  group: tests-${{ github.workflow }}-${{ inputs.target_sha || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SONGCHART_CI_SHA }}
      - run: touch .env
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 / 2.37.2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, intl, mbstring, pcntl, pdo_pgsql, redis, sockets, xml, zip
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer quality:verify

  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: songchart_test
          POSTGRES_USER: songchart_test
          POSTGRES_PASSWORD: songchart_test_only
        options: >-
          --health-cmd "pg_isready -U songchart_test -d songchart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 6379:6379
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: songchart_ci_development
      DB_USERNAME: songchart_test
      DB_PASSWORD: songchart_test_only
      TEST_PGSQL_HOST: 127.0.0.1
      TEST_PGSQL_PORT: 5432
      TEST_PGSQL_DATABASE: songchart_test
      TEST_PGSQL_USERNAME: songchart_test
      TEST_PGSQL_PASSWORD: songchart_test_only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SONGCHART_CI_SHA }}
      - run: touch .env
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 / 2.37.2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, intl, mbstring, pcntl, pdo_pgsql, redis, sockets, xml, zip
          coverage: none
      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test:postgres
      - name: Summarize PostgreSQL failure
        if: failure()
        shell: bash
        run: |
          log='storage/logs/postgres-test-last-failure.log'
          if [ ! -f "$log" ]; then
            echo 'PostgreSQL test failed before a failure log was produced.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          clean_tail="$(tail -n 160 "$log" | sed -E $'s/\x1B\[[0-9;]*[mK]//g')"
          {
            echo '### PostgreSQL failure tail'
            echo
            echo '```text'
            printf '%s\n' "$clean_tail"
            echo '```'
            echo
            echo "Full failure evidence remains available as the run artifact for SHA $SONGCHART_CI_SHA."
          } >> "$GITHUB_STEP_SUMMARY"

          echo '::group::PostgreSQL failure tail'
          printf '%s\n' "$clean_tail"
          echo '::endgroup::'
      - name: Preserve PostgreSQL failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-failure-${{ env.SONGCHART_CI_SHA }}-${{ github.run_attempt }}
          path: storage/logs/postgres-test-last-failure.log
          if-no-files-found: warn
          retention-days: 7

  browser-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: songchart_browser
          POSTGRES_USER: songchart_browser
          POSTGRES_PASSWORD: songchart_browser_only
        options: >-
          --health-cmd "pg_isready -U songchart_browser -d songchart_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 6379:6379
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: songchart_browser
      DB_USERNAME: songchart_browser
      DB_PASSWORD: songchart_browser_only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SONGCHART_CI_SHA }}
      - run: touch .env
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 / 2.37.2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, intl, mbstring, pcntl, pdo_pgsql, redis, sockets, xml, zip
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Prepare browser database
        run: php artisan migrate --force --no-interaction
      - name: Run desktop/mobile browser smoke
        run: vendor/bin/pest tests/Browser --compact
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ env.SONGCHART_CI_SHA }}-${{ github.run_attempt }}
          path: |
            tests/Browser/Screenshots
            storage/logs
          if-no-files-found: warn
          retention-days: 7

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SONGCHART_CI_SHA }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  classify:
    name: classify exact-head verification
    if: always()
    needs:
      - quality
      - tests-postgres
      - browser-smoke
      - frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Write machine failure classification
        id: classify
        shell: bash
        env:
          QUALITY: ${{ needs.quality.result }}
          POSTGRES: ${{ needs.tests-postgres.result }}
          BROWSER: ${{ needs.browser-smoke.result }}
          FRONTEND: ${{ needs.frontend-build.result }}
        run: |
          failures=()
          [ "$QUALITY" = success ] || failures+=(quality-governance)
          [ "$POSTGRES" = success ] || failures+=(database-runtime)
          [ "$BROWSER" = success ] || failures+=(browser-smoke)
          [ "$FRONTEND" = success ] || failures+=(frontend-build)

          if [ ${#failures[@]} -eq 0 ]; then
            classification=passed
          else
            classification="$(IFS=,; echo "${failures[*]}")"
          fi

          cat > ci-failure-classification.json <<JSON
          {
            "schema_version": 1,
            "exact_sha": "$SONGCHART_CI_SHA",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "quality": "$QUALITY",
            "postgres": "$POSTGRES",
            "browser": "$BROWSER",
            "frontend": "$FRONTEND",
            "classification": "$classification"
          }
          JSON

          {
            echo '## Exact-head verification classification'
            echo
            echo "- SHA: $SONGCHART_CI_SHA"
            echo "- Quality: $QUALITY"
            echo "- PostgreSQL: $POSTGRES"
            echo "- Browser: $BROWSER"
            echo "- Frontend: $FRONTEND"
            echo "- Classification: $classification"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "classification=$classification" >> "$GITHUB_OUTPUT"

      - name: Preserve bounded machine classification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-classification-${{ env.SONGCHART_CI_SHA }}-${{ github.run_attempt }}
          path: ci-failure-classification.json
          retention-days: 7

      - name: Write accepted-main provenance
        if: steps.classify.outputs.classification == 'passed' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > accepted-main-provenance.json <<JSON
          {
            "schema_version": 1,
            "accepted_main_sha": "$SONGCHART_CI_SHA",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_attempt": "${{ github.run_attempt }}",
            "repository": "${{ github.repository }}"
          }
          JSON

      - name: Preserve accepted-main provenance
        if: steps.classify.outputs.classification == 'passed' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accepted-main-provenance-${{ env.SONGCHART_CI_SHA }}
          path: accepted-main-provenance.json
          retention-days: 30

      - name: Fail when an owning verification lane failed
        if: steps.classify.outputs.classification != 'passed'
        run: exit 1
